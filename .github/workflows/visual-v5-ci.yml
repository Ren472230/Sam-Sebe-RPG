name: Visual v5 CI

on:
  push:
    branches:
      - visual-v5-digit-renderer
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install Python test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify digit renderer
        run: node --test prototype/visual-v5-digit-renderer/tests/*.test.cjs
      - name: Compile Python project
        run: python -m compileall -q src scripts
      - name: Verify shared world
        run: python -m pytest -q
