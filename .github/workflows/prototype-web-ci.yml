name: Prototype Web CI

on:
  push:
    branches:
      - dev/prototype-art-svg
    paths:
      - "web/**"
      - ".github/workflows/prototype-web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/prototype-web-ci.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install server package
        run: python -m pip install -e ..

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run web contract tests
        run: npm run test:contract

      - name: Build web client
        run: npm run build

      - name: Run browser vertical slice
        run: npm run test:e2e

      - name: Run Living NPC browser acceptance
        run: npm run test:e2e:living-npc

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prototype-browser-evidence
          path: |
            web/test-results
            web/test-results-living-npc
            web/playwright-report
            web/playwright-report-living-npc
          if-no-files-found: warn
          retention-days: 7
