name: Stream Slice Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: stream-slice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stream-slice:
    name: Stream Slice backend + Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend
        run: python -m pip install -e ".[dev]"

      - name: Stream Slice Python tests
        env:
          OPENAI_API_KEY: ""
        run: python -m pytest -q tests/test_stream_slice*.py

      - name: Stream Slice preflight
        env:
          OPENAI_API_KEY: ""
        run: python scripts/stream_preflight.py

      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Web contract tests
        working-directory: web
        run: npm run test:contract

      - name: Production build
        working-directory: web
        run: npm run build

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Stream Slice Chromium acceptance
        working-directory: web
        env:
          OPENAI_API_KEY: ""
        run: npm run test:e2e:stream-slice

      - name: Upload Stream Slice evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-slice-evidence
          path: |
            web/test-results-stream-slice
            web/playwright-report-stream-slice
          if-no-files-found: warn
          retention-days: 14
