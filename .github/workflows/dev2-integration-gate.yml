name: DEV2 Integration Gate

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"
      - name: Backend smoke and regression suite
        run: |
          python scripts/smoke_vertical_slice.py
          python -m pytest -q
      - name: Install frontend dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Frozen API contract tests
        working-directory: web
        run: npm run test:contract
      - name: Production build
        working-directory: web
        run: npm run build
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Real browser critical route
        working-directory: web
        run: rm -rf release-evidence && mkdir -p release-evidence && node scripts/reset-e2e.mjs && npx playwright test tests/vertical-slice.spec.ts
      - name: Browser error handling
        working-directory: web
        run: npx playwright test tests/error-handling.spec.ts
      - name: Persisted browser console smoke
        working-directory: web
        run: npx playwright test tests/console-smoke.spec.ts
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev2-integration-gate
          path: |
            web/release-evidence
            web/test-results
            web/playwright-report
          if-no-files-found: ignore
          retention-days: 7
