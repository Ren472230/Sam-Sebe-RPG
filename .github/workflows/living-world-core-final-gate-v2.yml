name: Living World Core Final Gate v2

on:
  pull_request:
    branches: ["ci/living-world-core-final-gate-v2"]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"
      - name: Focused Living World tests
        run: python -m pytest -q tests/test_living_world.py tests/test_living_world_no_respawn.py
      - name: Full backend test suite
        run: python -m pytest -q
      - name: Vertical slice smoke
        run: python scripts/smoke_vertical_slice.py
      - name: Compile Python sources
        run: python -m compileall -q src scripts
