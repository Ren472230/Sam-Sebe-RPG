name: Actions Storage Audit

on:
  push:
    branches:
      - ops/actions-storage-cleanup-2026-09-08
    paths:
      - ".github/workflows/actions-storage-audit.yml"

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Final active storage check
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {owner, repo, per_page: 100});
            const active = artifacts.filter(a => !a.expired);
            const sum = xs => xs.reduce((s, a) => s + a.size_in_bytes, 0);
            console.log(`FINAL_ACTIVE_COUNT=${active.length}`);
            console.log(`FINAL_ACTIVE_BYTES=${sum(active)}`);
            const groups = new Map();
            for (const a of active) {
              const g = groups.get(a.name) || {count: 0, bytes: 0};
              g.count += 1;
              g.bytes += a.size_in_bytes;
              groups.set(a.name, g);
            }
            for (const [name, g] of [...groups.entries()].sort((a,b) => b[1].bytes - a[1].bytes)) {
              console.log(["FINAL_GROUP", name, g.count, g.bytes].join("\t"));
            }
