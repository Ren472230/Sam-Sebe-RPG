name: Pilot CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src scripts
      - name: Test
        run: python -m pytest -q

  windows-launcher-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Diagnose Windows Python discovery
        shell: powershell
        run: |
          Write-Host "python command:"
          Get-Command python | Format-List Name,CommandType,Source,Path
          python --version
          Write-Host "python exit=$LASTEXITCODE"
          Write-Host "py command:"
          Get-Command py -ErrorAction SilentlyContinue | Format-List Name,CommandType,Source,Path
          py -3.12 --version
          Write-Host "py exit=$LASTEXITCODE"
          $probe = 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")'
          Write-Host "probe text=$probe"
          & python -c $probe
          Write-Host "probe exit=$LASTEXITCODE"
      - name: Run systems launcher through batch
        shell: cmd
        run: |
          call "Играть_системный_режим.bat" < NUL
          if errorlevel 1 exit /b %errorlevel%
          if not exist ".venv\Scripts\sam-sebe-rpg.exe" exit /b 31
          if not exist "playtests\founder-systems.db" exit /b 32
