name: Release lock bootstrap

on:
  push:
    branches:
      - agent/release-reproducibility-v1
    paths:
      - ".github/workflows/release-lock-bootstrap.yml"
      - "web/package.json"
      - "web/package-lock.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate npm lockfile
        working-directory: web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- web/package-lock.json && git ls-files --error-unmatch web/package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json is already materialized and current."
            exit 0
          fi
          git config user.name "release-reproducibility-bot"
          git config user.email "release-reproducibility-bot@users.noreply.github.com"
          git add web/package-lock.json
          git commit -m "build: materialize npm lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
