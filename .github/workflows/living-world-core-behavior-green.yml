name: Living World Core Behavior GREEN

on:
  pull_request:
    branches: ["ci/living-world-core-behavior-green"]

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"
      - name: Focused Living World contract
        run: python -m pytest -q tests/test_living_world.py
