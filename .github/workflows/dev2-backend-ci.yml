name: DEV-2 backend integration

on:
  push:
    branches:
      - dev/living-world-integration

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Living World integration
        run: python -m pytest -q tests/test_living_world_integration.py
      - name: API regression
        run: python -m pytest -q tests/test_api.py
      - name: Oren quest regression
        run: python -m pytest -q tests/test_quest.py
      - name: Restart persistence regression
        run: python -m pytest -q tests/test_time_and_idempotency.py tests/test_api.py::test_api_completes_exact_once_firewood_route_and_persists_restart
      - name: Vertical slice acceptance
        run: python -m pytest -q tests/test_vertical_slice_acceptance.py
      - name: Full Python suite
        run: python -m pytest -q
      - name: Vertical slice smoke
        run: python scripts/smoke_vertical_slice.py
